name: CI

on:
  push:
  pull_request:

jobs:
  # ── Layer-1 sanitize gate (structural patterns only; private literal denylist is absent in CI by design) ──
  sanitize:
    name: Sanitize check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run structural sanitize gate
        run: bash tools/sanitize.sh

  # ── Build and test ────────────────────────────────────────────────────────────
  build-test:
    name: Build and test
    runs-on: ubuntu-latest
    needs: sanitize
    steps:
      - uses: actions/checkout@v4

      - name: Set up .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version-file: global.json

      - name: Restore (locked mode)
        run: dotnet restore src/ApiPlatform.slnx --locked-mode

      - name: Build
        run: dotnet build src/ApiPlatform.slnx -c Release --no-restore

      - name: Test
        run: dotnet test src/ApiPlatform.slnx -c Release --no-build
