# Spectral ruleset — the API style guide, enforced as machine-checkable lint.
# This file IS the consistency gate. An agent self-corrects against `npm run lint:api`.
#
# Primary lint targets:
#   Legacy hand-authored specs : openapi/_legacy/*.yaml
#   TypeSpec-emitted contracts : spec/tsp-output/openapi.v1.yaml
#
# Run:  npx spectral lint spec/tsp-output/openapi.v1.yaml --ruleset .spectral.yaml
#   or: npx spectral lint "openapi/**/*.yaml" --ruleset .spectral.yaml
extends:
  - "spectral:oas"

rules:
  # ── Naming & shape ────────────────────────────────────────────────────────
  paths-kebab-case:
    description: Paths must be lower kebab-case plural nouns (e.g. /accounts, /loan-applications).
    message: "{{path}} must be lower kebab-case (no camelCase, no underscores)."
    severity: error
    given: $.paths[*]~
    then:
      function: pattern
      functionOptions:
        match: "^(/v[0-9]+)?(/[a-z0-9]+(-[a-z0-9]+)*(/\\{[a-zA-Z0-9]+\\})?)+$"

  version-in-path:
    description: Every path must carry a major version prefix (/v1, /v2 ...).
    message: "{{path}} must begin with a /v<major> segment."
    severity: error
    given: $.paths[*]~
    then:
      function: pattern
      functionOptions:
        match: "^/v[0-9]+/"

  operation-operationId-required:
    description: Every operation needs an operationId (drives codegen + client method names).
    severity: error
    given: $.paths[*][get,put,post,delete,patch]
    then:
      field: operationId
      function: truthy

  # ── Errors must be Problem Details ────────────────────────────────────────
  error-response-is-problem-json:
    description: 4xx/5xx responses must use application/problem+json (RFC 9457).
    message: "Error responses must declare application/problem+json content."
    severity: error
    given: $.paths[*][*].responses[?(@property.match(/^(4|5)/))].content
    then:
      field: "application/problem+json"
      function: truthy

  # ── Discoverability ───────────────────────────────────────────────────────
  operation-needs-summary:
    description: Operations must have a human summary (surfaces in the dev portal).
    severity: warn
    given: $.paths[*][get,put,post,delete,patch]
    then:
      field: summary
      function: truthy

  responses-need-examples:
    description: 2xx responses should carry an example so the portal + mock are useful.
    severity: warn
    given: $.paths[*][*].responses[?(@property.match(/^2/))].content[*]
    then:
      field: examples
      function: truthy

  # ── Security ──────────────────────────────────────────────────────────────
  api-must-declare-security:
    description: The API must declare an OAuth2/scopes security scheme.
    severity: error
    given: $.components.securitySchemes
    then:
      function: truthy

  operations-must-require-scope:
    description: Every operation must declare a security requirement (a scope).
    severity: error
    given: $.paths[*][get,put,post,delete,patch]
    then:
      field: security
      function: truthy

  # ── Source-system metadata for the catalog/portal ─────────────────────────
  schema-source-system-tagged:
    description: Resource schemas should record their backing source system via x-source-system.
    severity: warn
    given: $.components.schemas[*]
    then:
      field: "x-source-system"
      function: truthy

# ── TypeSpec-emitted output overrides ────────────────────────────────────────
# TypeSpec places security at the API (global) level via @useAuth; per-operation
# security fields are therefore absent by design. Downgrade that error to a
# warning for the emitted contract so `make lint` exits cleanly.
# x-source-system is a hand-authoring convention; TypeSpec does not emit it.
overrides:
  - files:
      - "spec/tsp-output/**/*.yaml"
    rules:
      operations-must-require-scope: warn
      schema-source-system-tagged: off
