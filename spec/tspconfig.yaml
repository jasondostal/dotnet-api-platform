emit:
  - "@typespec/openapi3"
  - "@typespec/json-schema"

options:
  "@typespec/openapi3":
    emitter-output-dir: "{project-root}/tsp-output"
    openapi-versions:
      - "3.1.0"
    output-file: "openapi.{version}.yaml"
  "@typespec/json-schema":
    emitter-output-dir: "{project-root}/tsp-output/json-schema"
